# For documentation on these options, see `man fnott.ini`

[main]
# see `hyprctl monitors` for available outputs
output=eDP-1

min-width=0
max-width=0
max-height=0

stacking-order=bottom-up
anchor=top-right

edge-margin-vertical=5
edge-margin-horizontal=5
notification-margin=5

icon-theme=hicolor
max-icon-size=64
# selection-helper=dmenu
# selection-helper-uses-null-separator=no
# play-sound=aplay ${filename}

# Default values, may be overridden in 'urgency' specific sections
# layer=top
background=1793d1FF

border-color=000000FF
border-radius=0
border-size=3

# padding-vertical=20
# padding-horizontal=20

# dpi-aware=no

title-font=Merriweather:weight=bold:size=12
title-color=333333FF
title-format=<i>%a%A</i>

summary-font=Merriweather:size=10
summary-color=333333FF
summary-format=<b>%s</b>\n

body-font=Merriweather:size=8
body-color=333333FF
body-format=%b

# progress-bar-height=20
# progress-color=ffffffff
# progress-style=bar

# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
max-timeout=6

# [low]
# background=2b2b2bff
# title-color=888888ff
# summary-color=888888ff
# body-color=888888ff

# [normal]

# [critical]
