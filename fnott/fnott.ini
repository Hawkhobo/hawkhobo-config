# For documentation on these options, see `man fnott.ini`

[main]
# see `hyprctl monitors` for available outputs
output=eDP-1

min-width=0
max-width=0
max-height=0

stacking-order=bottom-up
anchor=top-left

edge-margin-vertical=5
edge-margin-horizontal=5
notification-margin=5

icon-theme=hicolor
max-icon-size=64
selection-helper=rofi
# selection-helper-uses-null-separator=no
play-sound=/home/jacob/.config/fnott/random-sound.sh ${filename}

scaling-filter=lanczos3

# Default values, may be overridden in 'urgency' specific sections
#
layer=top
background=1793d1BF

border-color=000000FF
border-radius=0
border-size=3

padding-vertical=10
padding-horizontal=10

# dpi-aware=no

title-font=Merriweather:weight=bold:size=12
title-color=333333FF
title-format=<i>%a%A</i>

summary-font=Merriweather:size=10
summary-color=333333FF
summary-format=<b>%s</b>\n

body-font=Merriweather:size=8
body-color=333333FF
body-format=%b

# progress-bar-height=20
# progress-color=ffffffff
# progress-style=bar

# sound-file: no value here => silent by default.  Set it per-urgency below.
# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
max-timeout=4

# Only urgencies with a sound-file set make any noise.  The value is handed to
# random-sound.sh: a directory => random .wav from it, a file => that file.

[low]
# background=2b2b2bff
# title-color=888888ff
# summary-color=888888ff
# body-color=888888ff
# (no sound-file => silent)

[normal]
sound-file=/home/jacob/.config/fnott/notify-sounds

[critical]
# background=6c3333ff
sound-file=/home/jacob/.config/fnott/notify-sounds

